<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#063B29" />
  <meta name="description" content="Moe's PureBite — 100% Dedicated Gluten-Free Restaurant & Kitchen. Safe for Celiac, fresh ingredients, pure food, and loved by families. Order easily via WhatsApp." />
  <meta name="keywords" content="Moe's PureBite, Gluten Free, Celiac Safe, Gluten Free Burger, Amman Gluten Free, Pure Food, Broasted Chicken, Mandi, Zurbian, Kabsa" />
  
  <!-- Open Graph -->
  <meta property="og:title" content="Moe's PureBite — 100% Gluten-Free Restaurant" />
  <meta property="og:description" content="Pure Food. Pure Life. 100% dedicated gluten-free kitchen. Safe for celiac, no cross contamination." />
  <meta property="og:image" content="assets/images/logo_new.jpg" />
  <meta property="og:type" content="website" />
  
  <title>Moe's PureBite — 100% Gluten-Free Restaurant</title>
  <link rel="icon" type="image/png" href="assets/images/logo_circle.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <!-- Core CSS -->
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/customer.css?v=1.4" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>

  <!-- Toast Notification Mount -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- CUSTOMER-FACING APP WRAPPER -->
  <div id="customer-app-wrapper" class="app-container">
    
    <!-- Top Navigation Bar -->
    <header class="site-header">
      <div class="header-left">
        <button class="btn-hamburger" onclick="CustomerApp.toggleSidebar()" aria-label="Open navigation menu">
          ☰
        </button>
      </div>

      <div class="header-center" id="header-center-content">
        <span class="header-page-title">Moe's PureBite</span>
      </div>

      <div class="header-right">
        <button id="btn-lang-switcher" class="btn-lang-toggle" aria-label="Switch Language" onclick="CustomerApp.toggleLanguage()">عربي</button>
        <a href="#cart" class="btn-cart-icon" aria-label="View Cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </header>

    <!-- Sliding Sidebar Drawer (Deep Forest Green) -->
    <nav class="sidebar-drawer" id="sidebar-drawer" aria-label="Main sidebar navigation">
      <div class="sidebar-top">
        <div class="sidebar-brand-emblem logo-shimmer-effect">
          <img src="assets/images/logo_new.jpg" alt="Moe's PureBite Emblem" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div class="sidebar-brand-name">Moe's <span>PureBite</span></div>
        <div class="sidebar-brand-tagline" data-i18n="tagline">PURE FOOD. PURE LIFE.</div>

        <!-- Sidebar Navigation Items ONLY (No Bottom Bar, No Extra Pages) -->
        <div class="sidebar-nav">
          <a href="#home" class="sidebar-nav-item active" onclick="CustomerApp.closeSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav_home">Home</span>
          </a>
          <a href="#menu" class="sidebar-nav-item" onclick="CustomerApp.closeSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span data-i18n="nav_menu">Menu</span>
          </a>
          <a href="#about" class="sidebar-nav-item" onclick="CustomerApp.closeSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span data-i18n="nav_about">About Us</span>
          </a>
          <a href="#cart" class="sidebar-nav-item" onclick="CustomerApp.closeSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span data-i18n="nav_cart">Cart</span>
          </a>
        </div>
      </div>

      <div class="sidebar-bottom">
        <button class="btn-sidebar-wa" onclick="CustomerApp.directWhatsAppContact()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c4.55 0 8.25 3.7 8.25 8.24 0 2.2-.86 4.28-2.42 5.84-1.56 1.56-3.64 2.42-5.84 2.42-1.42 0-2.82-.37-4.06-1.08l-.29-.17-3.12.82.83-3.04-.19-.3a8.163 8.163 0 0 1-1.26-4.48c0-4.54 3.7-8.24 8.25-8.24zm4.52 11.66c-.25-.13-1.48-.73-1.71-.81-.23-.09-.4-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.4-1.76-.15-.25-.02-.39.11-.51.11-.11.25-.29.38-.44.13-.15.17-.25.25-.42.08-.17.04-.32-.02-.45s-.56-1.35-.77-1.85c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.48-.61 1.69-1.2.21-.58.21-1.08.15-1.2-.06-.11-.23-.18-.48-.3z"/></svg>
          <span data-i18n="order_wa">Order via WhatsApp</span>
        </button>
      </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div class="modal-overlay" id="sidebar-overlay"></div>

    <!-- Main View Dynamic Container -->
    <main id="main-view-container"></main>

    <!-- Sticky Bottom Cart Bar (Appears when cart has items) -->
    <div class="sticky-cart-bar" id="sticky-cart-bar">
      <div class="sticky-cart-left">
        <div class="sticky-cart-icon-wrap">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="sticky-cart-badge" id="sticky-cart-count-val">0</span>
        </div>
        <div class="sticky-cart-meta">
          <span class="sticky-cart-label">Your Order (<span id="sticky-cart-items-lbl">0 items</span>)</span>
          <span class="sticky-cart-total" id="sticky-cart-total-val">0.00 JOD</span>
        </div>
      </div>
      <a href="#cart" class="btn-sticky-view-cart">
        <span>View Cart</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>

    <!-- Customer Modal Overlay & Product Details Bottom Sheet -->
    <div class="modal-overlay" id="customer-modal-overlay"></div>
    <div class="product-modal" id="product-modal-container" role="dialog" aria-modal="true"></div>

  </div>

  <!-- ADMIN LOGIN CONTAINER -->
  <div id="admin-login-container" style="display: none; height: 100vh; align-items: center; justify-content: center; background-color: var(--c-cream); padding: 20px;">
    <div style="background: #fff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(6, 59, 41, 0.1); width: 100%; max-width: 400px; text-align: center;">
      <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: var(--c-forest); border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 10px;">
        <img src="assets/images/logo_new.jpg" alt="Moe's PureBite" style="width: 100%; object-fit: contain; filter: brightness(0) invert(1);" />
      </div>
      <h2 style="color: var(--c-forest); margin-bottom: 8px; font-family: var(--font-serif); font-size: 1.8rem;">Admin Login</h2>
      <p style="color: #666; margin-bottom: 24px; font-size: 0.9rem;">Please sign in to access the dashboard.</p>
      
      <div style="margin-bottom: 16px; text-align: left;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--c-forest); margin-bottom: 6px;">Admin Email</label>
        <input type="email" id="admin-username-input" placeholder="Enter your email" style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--c-forest)'" onblur="this.style.borderColor='#ddd'" />
      </div>
      
      <div style="margin-bottom: 24px; text-align: left;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; color: var(--c-forest); margin-bottom: 6px;">Password</label>
        <input type="password" id="admin-password-input" placeholder="Enter password" style="width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='var(--c-forest)'" onblur="this.style.borderColor='#ddd'" onkeypress="if(event.key === 'Enter') App.handleAdminLogin()" />
      </div>
      
      <button onclick="App.handleAdminLogin()" style="width: 100%; background: var(--c-forest); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: transform 0.2s, background 0.2s;" onmouseover="this.style.transform='translateY(-2px)'; this.style.backgroundColor='#0a4f38'" onmouseout="this.style.transform='translateY(0)'; this.style.backgroundColor='var(--c-forest)'">
        Sign In
      </button>
      <div id="admin-login-error" style="color: #d32f2f; margin-top: 16px; font-size: 0.85rem; display: none; font-weight: 600;">Invalid username or password.</div>
    </div>
  </div>

  <!-- ADMIN DASHBOARD CONTAINER (Mounted when route is #admin) -->
  <div id="admin-view-container" style="display: none;"></div>

  <!-- Application Logic Scripts -->
  <!-- Supabase JS SDK (UMD Build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabaseClient.js"></script>

  <script src="assets/js/i18n.js?v=1.2"></script>
  <script src="assets/js/store.js?v=1.1"></script>
  <script src="assets/js/customer.js?v=1.4"></script>
  <script src="assets/js/admin.js?v=1.2"></script>
  <script src="assets/js/app.js?v=1.1"></script>
</body>
</html>
